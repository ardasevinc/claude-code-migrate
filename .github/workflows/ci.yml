name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run full gate
        run: bun run check
      - name: Audit dependencies
        run: bun audit

  package_smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Pack once and smoke exact tarball
        shell: bash
        run: |
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          bun scripts/smoke-package.ts "$RUNNER_TEMP/$tarball"

  required:
    name: Required
    if: always()
    needs: [test, package_smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_SMOKE_RESULT: ${{ needs.package_smoke.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$PACKAGE_SMOKE_RESULT" = success
