name: Bun dependencies

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bun-dependencies
  cancel-in-progress: false

jobs:
  update:
    name: Refresh Bun lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Refresh dependencies
        run: bun update
      - name: Verify the refreshed lockfile
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit
      - name: Open update pull request when changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
            if git diff --quiet -- package.json bun.lock; then
              echo "Bun dependencies are current"
              exit 0
            fi

            open_prs=$(gh pr list \
              --state open \
              --base main \
              --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("automation/bun-dependencies-"))] | length')
            if [ "$open_prs" -gt 0 ]; then
              echo "A Bun dependency update pull request is already open"
              exit 0
            fi

            branch="automation/bun-dependencies-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          git add package.json bun.lock
          git commit -m "chore: refresh Bun dependencies"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh Bun dependencies" \
            --body $'Automated Bun dependency refresh.\n\nCI must pass before merge.'
