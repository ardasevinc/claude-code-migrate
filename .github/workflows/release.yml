name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify exact release artifact
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.artifact.outputs.name }}
      version: ${{ steps.artifact.outputs.version }}
      tarball_name: ${{ steps.artifact.outputs.tarball_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch release ancestry
        run: git fetch --force origin main:refs/remotes/origin/main --tags
      - name: Set up Node for artifact smoke
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin trusted-publishing npm client
        run: npm install --global npm@11.17.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run full gate
        run: bun run check
      - name: Pack once and prepare exact release artifact
        id: artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          tarball_name=$(npm pack --pack-destination "$release_dir" --silent)
          tarball="$release_dir/$tarball_name"
          metadata="$release_dir/release.json"
          bun scripts/prepare-release.ts \
            --tag "$RELEASE_TAG" \
            --tarball "$tarball" \
            --main-ref origin/main \
            --metadata "$metadata"
          {
            echo "name=$(jq -r .name "$metadata")"
            echo "version=$(jq -r .version "$metadata")"
            echo "tarball_name=$tarball_name"
          } >> "$GITHUB_OUTPUT"
      - name: Preserve verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ steps.artifact.outputs.version }}
          path: |
            ${{ runner.temp }}/release/${{ steps.artifact.outputs.tarball_name }}
            ${{ runner.temp }}/release/SHA256SUMS
            ${{ runner.temp }}/release/RELEASE_NOTES.md
            ${{ runner.temp }}/release/release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    name: Publish exact release artifact
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out release scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Node for npm trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin trusted-publishing npm client
        run: npm install --global npm@11.17.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Restore verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-${{ needs.prepare.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: Reverify transferred artifact
        working-directory: ${{ runner.temp }}/release
        run: sha256sum --check SHA256SUMS
      - name: Publish exact tarball through npm OIDC
        shell: bash
        env:
          TARBALL: ${{ runner.temp }}/release/${{ needs.prepare.outputs.tarball_name }}
        run: |
          set -euo pipefail
          decision=$(bun scripts/release-registry.ts decide "$TARBALL")
          case "$decision" in
            publish) npm publish "$TARBALL" --access public ;;
            already-published) echo "exact tarball is already published; continuing rerun" ;;
            *) echo "unexpected publication decision: $decision" >&2; exit 1 ;;
          esac
      - name: Verify registry artifact and installed CLI
        env:
          NAME: ${{ needs.prepare.outputs.name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TARBALL: ${{ runner.temp }}/release/${{ needs.prepare.outputs.tarball_name }}
        run: |
          bun scripts/release-registry.ts verify "$TARBALL"
          bun scripts/smoke-package.ts --registry "$NAME" "$VERSION"
      - name: Attest exact tarball
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/release/${{ needs.prepare.outputs.tarball_name }}
      - name: Create or reconcile GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TARBALL: ${{ runner.temp }}/release/${{ needs.prepare.outputs.tarball_name }}
          CHECKSUMS: ${{ runner.temp }}/release/SHA256SUMS
          NOTES: ${{ runner.temp }}/release/RELEASE_NOTES.md
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$NOTES"
            gh release upload "$RELEASE_TAG" "$TARBALL" "$CHECKSUMS" --clobber
          else
            gh release create "$RELEASE_TAG" "$TARBALL" "$CHECKSUMS" \
              --verify-tag --title "$RELEASE_TAG" --notes-file "$NOTES"
          fi
